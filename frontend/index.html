<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Créer un compte - Système de gestion des incidents informatiques</title>
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/signup.css" />
  </head>
  <body>
    <div class="page">
      <!-- LEFT: hero -->
      <section class="hero">
        <div class="hero-text">
          <h1>Système de gestion des<br />incidents informatiques</h1>
          <div class="rule"></div>
          <p>
            Une platforme centralisée pour déclarer, suivre et résoudre
            efficacement les incidents IT
          </p>
        </div>

        <div class="hero-art" aria-hidden="true">
          <img src="assets/ship.png" alt="" />
        </div>
      </section>

      <!-- RIGHT: signup card -->
      <section class="auth">
        <div class="card">
          <h2>Créer un compte</h2>
          <p class="subtitle">Inscrivez-vous pour accéder à votre espace</p>

          <div id="signupForm">
            <label for="username">Nom d'utilisateur</label>
            <div class="field">
              <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
                <circle cx="12" cy="7" r="4" />
              </svg>
              <input
                type="text"
                id="username"
                name="username"
                placeholder="Entrez votre nom d'utilisateur"
                required
              />
            </div>

            <label for="email">Email</label>
            <div class="field">
              <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="2" y="4" width="20" height="16" rx="2" />
                <path d="M22 6l-10 7L2 6" />
              </svg>
              <input
                type="email"
                id="email"
                name="email"
                placeholder="Entrez votre adresse mail"
                required
              />
            </div>

            <label for="password" id="password-label">Mot de passe</label>
            <div class="field">
              <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="11" width="18" height="11" rx="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <input
                type="password"
                id="password"
                name="password"
                placeholder="Créez un mot de passe"
                required
              />
            </div>

            <label for="confirmPassword" id="confirmPassword-label">Confirmer le mot de passe</label>
            <div class="field">
              <svg
                class="icon"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <rect x="3" y="11" width="18" height="11" rx="2" />
                <path d="M7 11V7a5 5 0 0 1 10 0v4" />
              </svg>
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Confirmez votre mot de passe"
                required
              />
            </div>

            <p class="signup-error" id="signup-error"></p>

            <button type="button" id="btn" class="btn-login">
              S'inscrire
            </button>
          </div>

          <p class="help">
            Déjà un compte ? <a href="pages/login.html">Se connecter</a>
          </p>
        </div>
      </section>
    </div>
    <script src="js/signup.js"></script>
  </body>
</html>
